name: Active board tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  active-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-mcp.txt
      - run: python tests/run_active.py
      - run: node --test tests/test_render.cjs
