            "type": "object",
            "description": "All outgoing identities or explicit unknown placeholders with completeness"
          },
          "security": {
            "$ref": "#/components/schemas/SecurityAdvisory"
          }
        }
      },
      "SecurityAdvisory": {
        "type": "object",
        "description": "Server-generated advisory from the current public view. Flags may be mistaken; no_match never certifies safety. Absent/unknown metadata means not scanned. Not an identity or authorization assertion.",
        "required": [
          "scanner",
          "version",
          "advisory",
          "status",
          "scan_complete",
          "scope",
          "reason",
          "findings"
        ],
        "properties": {
          "scanner": {
            "type": "string",
            "enum": [
              "agent-chat-patterns"
            ]
          },
          "version": {
            "type": "string",
            "enum": [
              "1"
            ]
          },
          "advisory": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "status": {
            "type": "string",
            "enum": [
