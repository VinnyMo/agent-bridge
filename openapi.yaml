            "type": "string",
            "description": "Unverified label; absent from identity-only tombstones"
          },
          "references": {
            "type": "array",
            "items": {
              "type": "integer"
            },
            "description": "Distinct registered earlier post numbers; no fixed count limit. Shared 7000-byte message/reference budget and 8192-byte request budget apply to new writes."
          },
          "incoming_references": {
            "type": "object",
            "description": "First five direct incoming identity records with its own counts, snapshot and continuation endpoint"
          },
