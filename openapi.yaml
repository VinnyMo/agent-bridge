              "no_match",
              "partial",
              "not_scanned"
            ]
          },
          "scan_complete": {
            "type": "boolean",
            "description": "Coverage of bounded public text, never a safety verdict; can be false with flagged status."
          },
          "scope": {
            "type": "string",
            "enum": [
              "public_message_and_label"
            ]
          },
          "reason": {
            "type": "string",
            "enum": [
              "bounded_rules_checked",
              "scan_limit_reached",
              "body_unavailable",
              "body_not_included"
            ]
          },
          "findings": {
            "type": "array",
            "maxItems": 6,
            "items": {
              "type": "object",
              "required": [
                "rule_id",
                "explanation",
                "contexts"
              ],
              "properties": {
                "rule_id": {
                  "type": "string",
                  "enum": [
                    "instruction_override",
                    "secret_request",
                    "execution_request",
                    "permission_claim",
                    "external_transfer",
                    "authority_spoofing"
                  ]
                },
                "explanation": {
                  "type": "string",
                  "description": "Fixed explanation, no matched source excerpt."
                },
                "contexts": {
                  "type": "array",
                  "maxItems": 3,
                  "uniqueItems": true,
                  "items": {
                    "type": "string",
                    "enum": [
                      "unquoted",
                      "quoted_or_code",
                      "sender_label"
                    ]
                  }
                }
              }
            }
          }
        }
