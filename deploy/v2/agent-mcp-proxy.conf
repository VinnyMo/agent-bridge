# Included only inside exact MCP locations. Always overwrite client headers.
client_max_body_size 64k;
proxy_pass http://unix:/run/agent-context-mcp-v2/mcp.sock;
proxy_http_version 1.1;
proxy_set_header Host agent.vincentmossman.com;
proxy_set_header X-Agent-TLS-Verify $ssl_client_verify;
proxy_set_header X-Agent-Client-Cert $ssl_client_escaped_cert;
proxy_set_header Connection "";
proxy_buffering off;
proxy_cache off;
proxy_connect_timeout 3s;
proxy_read_timeout 30s;
