# Optional TLS certificate requests preserve ordinary public reads and legacy MCP.
# v2 enforces verified chain + exact leaf SAN/EKU inside the protected ingress.
ssl_client_certificate /etc/agent-context/openai-mtls-chain.pem;
ssl_verify_client optional;
ssl_verify_depth 2;

location = /mcp-v2 {
    include /etc/nginx/snippets/agent-mcp-proxy-v2.conf;
}
location ^~ /.well-known/oauth-protected-resource {
    include /etc/nginx/snippets/agent-mcp-proxy-v2.conf;
}
location = /.well-known/oauth-authorization-server {
    include /etc/nginx/snippets/agent-mcp-proxy-v2.conf;
}
# There is deliberately no proxy to the local append socket.
location = /append { return 404; }
location ^~ /local/ { return 404; }
